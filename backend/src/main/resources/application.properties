# Multipart upload limits. The default 1 MB max-file-size rejects full-resolution
# face photos from physical devices (Samsung sensor: ~3-6 MB). Raised to 10 MB to
# accommodate all tested devices with headroom. max-request-size covers the whole
# multipart body (file + boundary + form fields), set slightly above max-file-size.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.datasource.url=jdbc:mysql://localhost:3306/smart_attendance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8080

# Face service URL. Android does not call this directly; Spring Boot does.
face.service.url=http://localhost:5001
# Service-to-service shared secret. Supply via FACE_SERVICE_SECRET env var.
face.service.secret=${FACE_SERVICE_SECRET}
# Face verification SFace cosine similarity threshold.
# Baseline default is 0.60. Calibrate empirically against genuine and impostor samples.
face.verification.similarity-threshold=${FACE_VERIFICATION_THRESHOLD:0.60}

# Required locally and in deployment. Keep this value outside source control.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
attendance.verification.expiration-seconds=${ATTENDANCE_VERIFICATION_EXPIRATION_SECONDS:120}

# Phase-1 active-liveness protocol. State is bounded, in-memory and single-instance
# only; replace it with a shared atomic store before horizontally scaling this feature.
active.liveness.session-timeout-seconds=${ACTIVE_LIVENESS_SESSION_TIMEOUT_SECONDS:30}
active.liveness.max-sessions=${ACTIVE_LIVENESS_MAX_SESSIONS:1000}
active.liveness.max-frame-bytes=${ACTIVE_LIVENESS_MAX_FRAME_BYTES:1048576}
active.liveness.max-frames=${ACTIVE_LIVENESS_MAX_FRAMES:30}
active.liveness.max-retries=${ACTIVE_LIVENESS_MAX_RETRIES:1}
active.liveness.min-frame-interval-ms=${ACTIVE_LIVENESS_MIN_FRAME_INTERVAL_MS:100}
active.liveness.terminal-retention-seconds=${ACTIVE_LIVENESS_TERMINAL_RETENTION_SECONDS:60}
active.liveness.cleanup-interval-ms=${ACTIVE_LIVENESS_CLEANUP_INTERVAL_MS:30000}


# ---------------- Geofence (ICT building) ----------------
# Students can only mark attendance when their phone is inside this circle.
# ( set geofence.enabled=false while developing).
geofence.enabled=true
geofence.zone-name=ICT Building
geofence.center-lat=28.417341
geofence.center-lng=77.523483
# Building size + GPS error buffer. Indoors, 80-150 m is typical.
geofence.radius-meters=90
# Reject a reading whose reported GPS error is worse than this.
geofence.max-accuracy-meters=50

# ---------------- Email OTP Verification ----------------
# dev-mode=true  -> OTP printed to console, no SMTP needed.
# dev-mode=false -> OTP sent via SMTP (Mailtrap / production).
app.otp.dev-mode=${APP_OTP_DEV_MODE:true}
app.otp.expiration-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# ---------------- SMTP Configuration --------------------
# Only required when app.otp.dev-mode=false.
# Supply via environment variables — never hardcode credentials.
# These have empty defaults so the app starts in dev-mode without them.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sender address — independent of the student's @gbu.ac.in recipient.
# Supply via APP_MAIL_FROM env var.
app.mail.from=${APP_MAIL_FROM:}

logging.level.org.springframework.security=INFO
