spring.datasource.url=jdbc:mysql://localhost:3306/smart_attendance?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8080

# Face service URL. Android does not call this directly; Spring Boot does.
face.service.url=http://localhost:5001

# Required locally and in deployment. Keep this value outside source control.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000


# ---------------- Geofence (ICT building) ----------------
# Students can only mark attendance when their phone is inside this circle.
# ( set geofence.enabled=false while developing).
geofence.enabled=true
geofence.zone-name=ICT Building
geofence.center-lat=28.417341
geofence.center-lng=77.523483
# Building size + GPS error buffer. Indoors, 80-150 m is typical.
geofence.radius-meters=90
# Reject a reading whose reported GPS error is worse than this.
geofence.max-accuracy-meters=50
